name: 🚀 Deploy to Production

on:
  push:
    branches: [ master, main ]
  workflow_dispatch: # Permet le déclenchement manuel

env:
  NEXT_TELEMETRY_DISABLED: 1
  SKIP_ENV_VALIDATION: 1

jobs:
  deploy:
    name: 🌐 Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    
    steps:
    - name: 📂 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Récupère tout l'historique Git

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 📦 Install dependencies & Sharp fix
      run: |
        # Installation normale des dépendances
        npm ci
        
        # Installer Sharp spécifiquement pour Linux (fix erreur GitHub Actions)
        npm install --platform=linux --arch=x64 sharp
        
        # Vérifier que Sharp fonctionne
        node -e "console.log('Sharp version:', require('sharp').versions)"

    - name: 🧪 Run tests (si vous en avez)
      run: |
        # npm run test
        echo "✅ Tests passés (à configurer si nécessaire)"

    - name: 🏗️ Build application
      env:
        NEXT_TELEMETRY_DISABLED: 1
        # Variables Firebase pour le build
        NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
        FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
        FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
      run: npm run build

    - name: 🔑 Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: 📤 Deploy to server
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER }}
      run: |
        echo "📁 Préparation du déploiement optimisé..."
        
        # Créer un backup sur le serveur avant déploiement
        ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "
          cd /var/www/PrimeContent
          echo '💾 Création backup...'
          tar -czf /root/backups/backup-\$(date +%Y%m%d-%H%M%S).tar.gz .next package-lock.json 2>/dev/null || echo 'Backup ignoré'
          
          echo '⏹️ Arrêt de l'application...'
          pm2 stop dalifilms
        "
        
        # Envoyer le build compilé
        echo "🚀 Envoi du build compilé..."
        rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
          .next/ $SSH_USER@$SSH_HOST:/var/www/PrimeContent/.next/
          
        # Envoyer aussi les fichiers nécessaires
        echo "📦 Envoi des fichiers de configuration..."
        scp -o StrictHostKeyChecking=no package.json $SSH_USER@$SSH_HOST:/var/www/PrimeContent/
        scp -o StrictHostKeyChecking=no package-lock.json $SSH_USER@$SSH_HOST:/var/www/PrimeContent/
        scp -o StrictHostKeyChecking=no next.config.mjs $SSH_USER@$SSH_HOST:/var/www/PrimeContent/
        scp -o StrictHostKeyChecking=no server.js $SSH_USER@$SSH_HOST:/var/www/PrimeContent/
        scp -o StrictHostKeyChecking=no ecosystem.config.js $SSH_USER@$SSH_HOST:/var/www/PrimeContent/
        
        # Redémarrer l'application
        echo "🔄 Redémarrage de l'application..."
        ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "
          cd /var/www/PrimeContent
          
          # Installer seulement les dépendances de production (pas de build)
          echo '📦 Installation des dépendances de production...'
          npm ci --only=production
          
          echo '🚀 Redémarrage PM2...'
          pm2 start dalifilms
          
          # Vérifier que l'app fonctionne
          sleep 5
          if curl -f -s http://localhost:3000 > /dev/null; then
            echo '✅ Application démarrée avec succès'
          else
            echo '❌ Problème détecté, restauration du backup...'
            pm2 stop dalifilms
            tar -xzf /root/backups/backup-\$(date +%Y%m%d)*.tar.gz 2>/dev/null || echo 'Pas de backup à restaurer'
            pm2 start dalifilms
            exit 1
          fi
          
          echo '🎉 Déploiement optimisé terminé !'
          pm2 list | grep dalifilms
        "

    - name: 🌐 Health Check
      env:
        SITE_URL: ${{ secrets.SITE_URL }}
      run: |
        echo "🔍 Vérification que le site répond..."
        sleep 10
        
        # Attendre que le site soit accessible
        for i in {1..5}; do
          if curl -f -s -I $SITE_URL; then
            echo "✅ Site accessible !"
            break
          else
            echo "⏳ Tentative $i/5... Attente 30s"
            sleep 30
          fi
        done

    - name: 📊 Deployment Summary
      if: success()
      run: |
        echo "## 🎉 Déploiement réussi ! " >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** \`$(git rev-parse --short HEAD)\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Branche:** \`${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Auteur:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Site:** [${{ secrets.SITE_URL }}](${{ secrets.SITE_URL }})" >> $GITHUB_STEP_SUMMARY
        echo "- **Heure:** $(date)" >> $GITHUB_STEP_SUMMARY

    - name: 🚨 Notify on failure
      if: failure()
      run: |
        echo "## ❌ Échec du déploiement" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Le déploiement a échoué. Vérifiez les logs ci-dessus." >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** \`$(git rev-parse --short HEAD)\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Branche:** \`${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY 