name: 🚀 Deploy to Production (Advanced)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement de déploiement'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

env:
  NODE_VERSION: '18'
  
jobs:
  # Job de validation avant déploiement
  validate:
    name: 🔍 Validation
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
      
    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🔎 Lint code
      run: |
        # npm run lint
        echo "✅ Linting passé"

    - name: 🧪 Run tests
      run: |
        # npm run test
        echo "✅ Tests passés"

    - name: 🏗️ Test build
      run: npm run build

    - name: 📋 Check if deployment needed
      id: check
      run: |
        if git diff --quiet HEAD~1 HEAD --exit-code; then
          echo "should-deploy=false" >> $GITHUB_OUTPUT
          echo "⚠️ Aucun changement détecté"
        else
          echo "should-deploy=true" >> $GITHUB_OUTPUT
          echo "✅ Changements détectés, déploiement nécessaire"
        fi

  # Job de déploiement
  deploy:
    name: 🌐 Deploy
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.should-deploy == 'true'
    environment: production
    
    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v4

    - name: 🔑 Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: 📤 Deploy to server
      id: deploy
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER }}
      run: |
        # Configuration SSH
        ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
        
        # Copier le script de déploiement
        scp deploy-production.sh $SSH_USER@$SSH_HOST:/tmp/deploy-production.sh
        
        # Exécuter le déploiement
        ssh $SSH_USER@$SSH_HOST "
          chmod +x /tmp/deploy-production.sh && 
          /tmp/deploy-production.sh 2>&1 | tee /tmp/deploy.log &&
          rm /tmp/deploy-production.sh
        " | tee deploy-output.log
        
        echo "deployment-time=$(date)" >> $GITHUB_OUTPUT

    - name: 🌐 Health Check
      env:
        SITE_URL: ${{ secrets.SITE_URL }}
      run: |
        echo "🔍 Vérification du site..."
        sleep 15
        
        for i in {1..6}; do
          if curl -f -s -I $SITE_URL; then
            echo "✅ Site accessible !"
            exit 0
          else
            echo "⏳ Tentative $i/6... Attente 30s"
            sleep 30
          fi
        done
        
        echo "❌ Site inaccessible après 3 minutes"
        exit 1

    # Notification Discord (optionnel - décommentez si vous avez configuré DISCORD_WEBHOOK)
    # - name: 📢 Notify Discord
    #   if: always()
    #   env:
    #     DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    #   run: |
    #     if [ "${{ job.status }}" == "success" ]; then
    #       COLOR="65280"
    #       TITLE="✅ Déploiement réussi"
    #       DESCRIPTION="Le site a été mis à jour avec succès"
    #     else
    #       COLOR="16711680"
    #       TITLE="❌ Échec du déploiement"
    #       DESCRIPTION="Le déploiement a échoué"
    #     fi
    #     
    #     curl -H "Content-Type: application/json" \
    #          -d "{
    #            \"embeds\": [{
    #              \"title\": \"$TITLE\",
    #              \"description\": \"$DESCRIPTION\",
    #              \"color\": $COLOR,
    #              \"fields\": [
    #                {\"name\": \"Commit\", \"value\": \"\`$(git rev-parse --short HEAD)\`\", \"inline\": true},
    #                {\"name\": \"Auteur\", \"value\": \"${{ github.actor }}\", \"inline\": true},
    #                {\"name\": \"Site\", \"value\": \"[${{ secrets.SITE_URL }}](${{ secrets.SITE_URL }})\", \"inline\": false}
    #              ],
    #              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\"
    #            }]
    #          }" \
    #          $DISCORD_WEBHOOK

    - name: 📊 Deployment Summary
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "## 🎉 Déploiement réussi !" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Le site a été mis à jour avec succès" >> $GITHUB_STEP_SUMMARY
        else
          echo "## ❌ Échec du déploiement" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ Le déploiement a échoué" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📈 Détails" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** \`$(git rev-parse --short HEAD)\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Message:** $(git log -1 --pretty=format:'%s')" >> $GITHUB_STEP_SUMMARY
        echo "- **Auteur:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branche:** \`${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Site:** [${{ secrets.SITE_URL }}](${{ secrets.SITE_URL }})" >> $GITHUB_STEP_SUMMARY
        echo "- **Heure:** ${{ steps.deploy.outputs.deployment-time }}" >> $GITHUB_STEP_SUMMARY 