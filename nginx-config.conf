# Configuration pour le domaine principal (application Next.js) - HTTP
server {
    listen 80;
    server_name dalifilms.fr www.dalifilms.fr;

    # Redirection HTTPS (sera activée après obtention des certificats)
    return 301 https://$server_name$request_uri;
}

# Serveur temporaire pour l'IP (avant redirection HTTPS)
server {
    listen 80;
    server_name 82.29.173.124 srv910965.hstgr.cloud;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Configuration pour le sous-domaine média (fichiers statiques) - HTTP
server {
    listen 80;
    server_name media.dalifilms.fr;

    # Redirection HTTPS pour les médias
    return 301 https://$server_name$request_uri;
}

# Configuration HTTPS pour l'application principale
server {
    listen 443 ssl http2;
    server_name dalifilms.fr www.dalifilms.fr;
    
    ssl_certificate /etc/letsencrypt/live/dalifilms.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dalifilms.fr/privkey.pem;
    
    # Configuration SSL moderne
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Headers de sécurité
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; font-src 'self' data: https:;" always;
    
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Configuration HTTPS pour les médias
server {
    listen 443 ssl http2;
    server_name media.dalifilms.fr;
    
    ssl_certificate /etc/letsencrypt/live/dalifilms.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dalifilms.fr/privkey.pem;
    
    # Configuration SSL moderne (même que ci-dessus)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Chemin vers le dossier des médias
    root /var/www/PrimeContentMedia;
    index index.html;

    # Sécurité : Désactiver les logs d'accès pour plus de confidentialité
    access_log off;
    
    # Headers de sécurité pour les médias
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Configuration des médias
    location / {
        # Vérifier que le fichier existe
        try_files $uri $uri/ =404;
        
        # Cache pour les médias (30 jours)
        expires 30d;
        add_header Cache-Control "public, no-transform";
        
        # Désactiver l'affichage du contenu des dossiers
        autoindex off;
    }

    # Protection contre l'accès direct aux fichiers sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Protection contre l'accès aux fichiers de configuration
    location ~ \.(conf|htaccess|htpasswd)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Limiter les types de fichiers autorisés
    location ~* \.(jpg|jpeg|png|gif|webp|svg|mp4|mov|avi|wmv|flv|webm)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Bloquer tous les autres types de fichiers
    location ~* \.(php|html|htm|js|css|txt|xml|json)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
} 