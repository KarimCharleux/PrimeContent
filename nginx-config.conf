# Configuration pour le domaine principal (application Next.js)
server {
    listen 80;
    server_name dalifilms.fr www.dalifilms.fr 82.29.173.124 srv910965.hstgr.cloud;

    # Redirection HTTPS (quand vous aurez le certificat SSL)
    # return 301 https://$server_name$request_uri;

    # En attendant le SSL, servir en HTTP
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Configuration pour le sous-domaine média (fichiers statiques)
server {
    listen 80;
    server_name media.dalifilms.fr;

    # Chemin vers le dossier des médias
    root /var/www/PrimeContentMedia;
    index index.html;

    # Sécurité : Désactiver les logs d'accès pour plus de confidentialité
    access_log off;
    
    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Configuration des médias
    location / {
        # Vérifier que le fichier existe
        try_files $uri $uri/ =404;
        
        # Cache pour les médias (30 jours)
        expires 30d;
        add_header Cache-Control "public, no-transform";
        
        # Désactiver l'affichage du contenu des dossiers
        autoindex off;
    }

    # Protection contre l'accès direct aux fichiers sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Protection contre l'accès aux fichiers de configuration
    location ~ \.(conf|htaccess|htpasswd)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Limiter les types de fichiers autorisés
    location ~* \.(jpg|jpeg|png|gif|webp|svg|mp4|mov|avi|wmv|flv|webm)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Bloquer tous les autres types de fichiers
    location ~* \.(php|html|htm|js|css|txt|xml|json)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

