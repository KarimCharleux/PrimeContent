# Configuration Nginx optimisée pour compatibilité Chrome Mobile
# Fix pour ERR_SSL_PROTOCOL_ERROR et ERR_CONNECTION_RESET

# Configuration pour le domaine principal (application Next.js) - HTTP
server {
    listen 80;
    server_name dalifilms.fr www.dalifilms.fr;

    # Redirection HTTPS (sera activée après obtention des certificats)
    return 301 https://$server_name$request_uri;
}

# Serveur temporaire pour l'IP (avant redirection HTTPS)
server {
    listen 80;
    server_name 82.29.173.124 srv910965.hstgr.cloud;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # ✅ Timeouts adaptés pour uploads 5GB
        proxy_connect_timeout 300s;        # 5 minutes pour la connexion
        proxy_send_timeout 3600s;          # 1 heure pour l'envoi  
        proxy_read_timeout 3600s;          # 1 heure pour la lecture
        
        # ✅ Configuration pour uploads 5GB
        client_max_body_size 5G;           # 5GB maximum
        proxy_buffering off;               # Désactiver le buffering pour les gros fichiers
        proxy_buffer_size 64k;             # Buffer plus grand
        proxy_buffers 8 64k;               # Plus de buffers
        proxy_request_buffering off;       # Streaming direct
    }
}

# Configuration pour le sous-domaine média (fichiers statiques) - HTTP
server {
    listen 80;
    server_name media.dalifilms.fr;

    # Redirection HTTPS pour les médias
    return 301 https://$server_name$request_uri;
}

# Configuration HTTPS pour l'application principale - OPTIMISÉE CHROME MOBILE
server {
    listen 443 ssl http2;
    server_name dalifilms.fr www.dalifilms.fr;
    
    ssl_certificate /etc/letsencrypt/live/dalifilms.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dalifilms.fr/privkey.pem;
    
    # 🔧 CONFIGURATION SSL COMPATIBLE CHROME MOBILE
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # 🚀 Ciphers élargis pour compatibilité Chrome Mobile/Desktop
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256';
    
    # 📱 Paramètres optimisés pour Chrome Mobile
    ssl_prefer_server_ciphers off;          # Laisser le client choisir (recommandé pour mobile)
    ssl_session_timeout 24h;                # Session plus longue pour mobile
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets on;                 # Tickets SSL pour performance mobile
    
    # 🔒 OCSP Stapling optimisé pour mobile
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/dalifilms.fr/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # 📋 Headers de sécurité adaptés pour Chrome Mobile
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # CSP moins restrictif pour compatibilité mobile
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; font-src 'self' data: https:; img-src 'self' data: https:; media-src 'self' data: https:;" always;
    
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 🔧 Headers supplémentaires pour Chrome Mobile
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        
        # ✅ Timeouts adaptés pour uploads 5GB
        proxy_connect_timeout 300s;        # 5 minutes pour la connexion
        proxy_send_timeout 3600s;          # 1 heure pour l'envoi  
        proxy_read_timeout 3600s;          # 1 heure pour la lecture
        
        # ✅ Configuration pour uploads 5GB
        client_max_body_size 5G;           # 5GB maximum
        proxy_buffering off;               # Désactiver le buffering pour les gros fichiers
        proxy_buffer_size 64k;             # Buffer plus grand
        proxy_buffers 8 64k;               # Plus de buffers
        proxy_request_buffering off;       # Streaming direct
    }
}

# Configuration HTTPS pour les médias - OPTIMISÉE CHROME MOBILE
server {
    listen 443 ssl http2;
    server_name media.dalifilms.fr;
    
    ssl_certificate /etc/letsencrypt/live/dalifilms.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dalifilms.fr/privkey.pem;
    
    # 🔧 MÊME CONFIGURATION SSL COMPATIBLE (identique au serveur principal)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 24h;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets on;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/dalifilms.fr/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # Chemin vers le dossier des médias
    root /var/www/PrimeContentMedia;
    index index.html;

    # Sécurité : Désactiver les logs d'accès pour plus de confidentialité
    access_log off;
    
    # Headers de sécurité pour les médias (adaptés Chrome Mobile)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Configuration des médias
    location / {
        # Headers CORS pour permettre l'accès cross-origin depuis dalifilms.fr
        add_header Access-Control-Allow-Origin "https://dalifilms.fr" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, Cache-Control" always;
        add_header Access-Control-Allow-Credentials "false" always;
        
        # Gérer les requêtes OPTIONS (preflight)
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "https://dalifilms.fr" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, Cache-Control" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0 always;
            add_header Content-Type "text/plain" always;
            return 204;
        }
        
        # Vérifier que le fichier existe
        try_files $uri $uri/ =404;
        
        # Cache pour les médias (30 jours)
        expires 30d;
        add_header Cache-Control "public, no-transform";
        
        # Désactiver l'affichage du contenu des dossiers
        autoindex off;
    }

    # Protection contre l'accès direct aux fichiers sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Protection contre l'accès aux fichiers de configuration
    location ~ \.(conf|htaccess|htpasswd)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Limiter les types de fichiers autorisés (avec support 5GB)
    location ~* \.(jpg|jpeg|png|gif|webp|svg|mp4|mov|avi|wmv|flv|webm)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        
        # ✅ Taille max des fichiers 5GB
        client_max_body_size 5G;
    }

    # Bloquer tous les autres types de fichiers
    location ~* \.(php|html|htm|js|css|txt|xml|json)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ✅ Configuration uploads 5GB avec sécurité
    location ~ /uploads?/ {
        client_max_body_size 5G;           # 5GB pour uploads
        proxy_read_timeout 3600s;          # 1 heure timeout
        proxy_send_timeout 3600s;
        proxy_request_buffering off;       # Streaming pour gros fichiers
        
        # Autoriser seulement certaines extensions
        location ~* \.(jpg|jpeg|png|gif|webp|svg|mp4|mov|avi|wmv|flv|webm)$ {
            try_files $uri =404;
        }
        # Bloquer tout le reste
        location ~ \. {
            deny all;
            return 404;
        }
    }
}
