# Configuration Nginx sécurisée renforcée pour Dalifilms

# Limitation du taux de requêtes (anti-DDoS)
limit_req_zone $binary_remote_addr zone=app:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=media:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=3r/s;

# Limitation des connexions simultanées
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

# Configuration pour le domaine principal (application Next.js) - HTTP
server {
    listen 80;
    server_name dalifilms.fr www.dalifilms.fr;

    # Redirection HTTPS (sera activée après obtention des certificats)
    return 301 https://$server_name$request_uri;
}

# Serveur temporaire pour l'IP (avant redirection HTTPS)
server {
    listen 80;
    server_name 82.29.173.124 srv910965.hstgr.cloud;

    # Limitation des connexions
    limit_conn conn_limit_per_ip 10;
    limit_req zone=app burst=20 nodelay;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Configuration pour le sous-domaine média (fichiers statiques) - HTTP
server {
    listen 80;
    server_name media.dalifilms.fr;

    # Redirection HTTPS pour les médias
    return 301 https://$server_name$request_uri;
}

# Configuration HTTPS pour l'application principale
server {
    listen 443 ssl http2;
    server_name dalifilms.fr www.dalifilms.fr;
    
    ssl_certificate /etc/letsencrypt/live/dalifilms.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dalifilms.fr/privkey.pem;
    
    # Configuration SSL moderne renforcée
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Headers de sécurité renforcés
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; media-src 'self' https://media.dalifilms.fr; connect-src 'self' https://www.google-analytics.com; frame-src 'self' https://www.youtube.com https://www.dailymotion.com;" always;
    
    # Limitation des requêtes et connexions
    limit_conn conn_limit_per_ip 15;
    limit_req zone=app burst=20 nodelay;
    
    # Cacher la version du serveur
    server_tokens off;
    
    # Protection contre les scans de vulnérabilités
    location ~ /\.(ht|git|svn) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }
    
    # Bloquer les bots malveillants
    if ($http_user_agent ~* (nmap|nikto|wikto|sf|sqlmap|bsqlbf|w3af|acunetix|havij|appscan)) {
        return 444;
    }
    
    # Protection contre les attaques admin
    location /backoffice/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
    
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # ✅ Timeouts adaptés pour uploads 5GB
        proxy_connect_timeout 300s;        # 5 minutes pour la connexion
        proxy_send_timeout 3600s;          # 1 heure pour l'envoi  
        proxy_read_timeout 3600s;          # 1 heure pour la lecture
        
        # ✅ Configuration pour uploads 5GB
        client_max_body_size 5G;           # 5GB maximum
        proxy_buffering off;               # Désactiver le buffering pour les gros fichiers
        proxy_buffer_size 64k;             # Buffer plus grand
        proxy_buffers 8 64k;               # Plus de buffers
        proxy_request_buffering off;       # Streaming direct
    }
}

# Configuration HTTPS pour les médias (sécurisée)
server {
    listen 443 ssl http2;
    server_name media.dalifilms.fr;
    
    ssl_certificate /etc/letsencrypt/live/dalifilms.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dalifilms.fr/privkey.pem;
    
    # Configuration SSL moderne (même que ci-dessus)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Chemin vers le dossier des médias
    root /var/www/PrimeContentMedia;
    index index.html;

    # Limitation pour les médias
    limit_conn conn_limit_per_ip 20;
    limit_req zone=media burst=50 nodelay;
    
    # Sécurité : Désactiver les logs d'accès pour plus de confidentialité
    access_log off;
    error_log /var/log/nginx/media-error.log error;
    
    # Headers de sécurité pour les médias
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Cacher la version du serveur
    server_tokens off;

    # Configuration des médias avec hotlink protection
    location / {
        # Protection contre le hotlinking
        valid_referers none blocked server_names *.dalifilms.fr dalifilms.fr;
        if ($invalid_referer) {
            return 403;
        }
        
        # Headers CORS pour permettre l'accès cross-origin depuis dalifilms.fr
        add_header Access-Control-Allow-Origin "https://dalifilms.fr" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, Cache-Control" always;
        add_header Access-Control-Allow-Credentials "false" always;
        
        # Gérer les requêtes OPTIONS (preflight)
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "https://dalifilms.fr" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, Cache-Control" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0 always;
            add_header Content-Type "text/plain" always;
            return 204;
        }
        
        # Vérifier que le fichier existe
        try_files $uri $uri/ =404;
        
        # Cache pour les médias (30 jours)
        expires 30d;
        add_header Cache-Control "public, no-transform";
        
        # Désactiver l'affichage du contenu des dossiers
        autoindex off;
    }

    # Protection contre l'accès direct aux fichiers sensibles
    location ~ /\.(ht|git|svn|env) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Protection contre l'accès aux fichiers de configuration
    location ~ \.(conf|htaccess|htpasswd|ini|log|sql|bak|old|tmp)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Limiter les types de fichiers autorisés (plus strict)
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|mp4|mov|avi|wmv|flv|webm|pdf)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        
        # ✅ Taille max des fichiers 5GB
        client_max_body_size 5G;
    }

    # Bloquer TOUS les autres types de fichiers
    location ~* \.(php|phtml|pl|py|jsp|asp|aspx|shtml|sh|cgi|exe|com|bat|cmd|pif|scr|vbs|js|html|htm|css|txt|xml|json|zip|rar|7z|tar|gz)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }
    
    # ✅ Configuration uploads 5GB avec sécurité
    location ~ /uploads?/ {
        client_max_body_size 5G;           # 5GB pour uploads
        proxy_read_timeout 3600s;          # 1 heure timeout
        proxy_send_timeout 3600s;
        proxy_request_buffering off;       # Streaming pour gros fichiers
        
        # Autoriser seulement certaines extensions
        location ~* \.(jpg|jpeg|png|gif|webp|svg|mp4|mov|avi|wmv|flv|webm)$ {
            try_files $uri =404;
        }
        # Bloquer tout le reste
        location ~ \. {
            deny all;
            return 404;
        }
    }
} 